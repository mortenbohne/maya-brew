name: Pytest Maya 2026

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: read

jobs:
  mayapy-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/maya-brew:sha-9daa1a4
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install uv
        run: mayapy -m pip install uv
      - name: Cache Python dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: mayapy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mayapy-${{ runner.os }}-
      - name: Install project (runtime + dev extras) with uv
        run: |
          mayapy -m uv pip install ".[dev]"
      - name: Run pytest
        run: mayapy -m pytest tests/ -q
      - name: Summary
        if: success()
        run: echo "mayapy pytest run succeeded." >> "$GITHUB_STEP_SUMMARY"
